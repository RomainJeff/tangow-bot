  if(!patch.reason){error('Indiquez pourquoi cette qualification est pertinente.');return;}

 else if(a==='exclude'){s.excludedNext=s.excludedNext.includes(v)?s.excludedNext.filter(x=>x!==v):[...s.excludedNext,v];inform('Préférence appliquée à la prochaine simulation. Cet instantané reste inchangé.');}

 render();persist();

});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.panel){s.panel=null;render();persist();}});

 render();persist();
});
