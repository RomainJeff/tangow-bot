const avatar=(bot='atlas',large=false)=>`<span class="r-avatar ${bot==='nova'?'nova':bot==='human'?'human':''} ${large?'large':''}">${bot==='nova'?'N':bot==='human'?'V':'A'}</span>`;

const proposalText='Lors du pilote Orion, le parcours d’invitation non testé a retardé l’ouverture.';
const sourceQuote='Au dernier pilote, le parcours d’invitation non testé a retardé l’ouverture.';
const base=[
{id:'scope',scope:'atlas',title:'Périmètre des entretiens Orion',text:'Les entretiens du pilote portent sur la recherche de documents. L’édition sera étudiée séparément.',topic:'Projet Orion',kind:'Connaissance',date:'18 sept.',source:'Note de cadrage · version 2',quote:'Cette série d’entretiens couvre la recherche de documents. L’édition sera étudiée séparément.',origin:'Document retenu par vous'},
{id:'format',scope:'team',title:'Format des comptes rendus',text:'Présenter les décisions prises, puis les questions encore ouvertes.',topic:'Coordination',kind:'Convention',date:'16 sept.',source:'Conventions d’équipe · version 3',quote:'Comptes rendus : décisions d’abord, puis questions ouvertes.',origin:'Publié par Camille'},
{id:'read',scope:'team',title:'Consulter avec le rôle lecteur',text:'Le rôle lecteur permet de consulter les documents du projet.',topic:'Accès aux documents',kind:'Connaissance',date:'15 sept.',source:'Matrice des rôles · version 4',quote:'Lecteur : consultation des documents autorisée.',origin:'Référentiel publié par Camille'},
{id:'edit',scope:'team',title:'Modifier avec le rôle lecteur',text:'Le rôle lecteur ne permet pas de modifier les documents du projet.',topic:'Accès aux documents',kind:'Connaissance',date:'15 sept.',source:'Matrice des rôles · version 4',quote:'Lecteur : modification des documents non autorisée.',origin:'Référentiel publié par Camille'},

{id:'personal',scope:'personal',title:'Une synthèse avant les détails',text:'Je préfère une synthèse courte, avec les détails à la demande.',topic:'Communication',kind:'Préférence',date:'10 sept.',source:'Votre préférence explicite',quote:'Je préfère commencer par une synthèse courte.',origin:'Déclaré par vous'}
];
const initial={route:'chat',agent:'atlas',tab:'own',panel:null,selected:'scope',sourceParent:null,returnPanel:null,proposal:'pending',retainedText:proposalText,shared:'none',sharedText:proposalText,consolidated:false,mergedText:'Le rôle lecteur permet de consulter les documents du projet, sans pouvoir les modifier.',retired:[],novaAccess:true,atlasAccess:true,checked:[],query:'',topic:'all',custom:[],feedback:[],message:'',lastReply:'',contextVersion:'original',trace:[{id:'launch',scope:'orion',title:'Date d’ouverture du pilote',text:base[4].text,reason:'Date applicable au projet Orion.'},{id:'format',scope:'team',title:'Format des comptes rendus',text:base[1].text,reason:'Convention applicable au compte rendu demandé.'}],traceUpdated:false,manualTitle:'',manualText:''};
let s={...initial,retired:[],checked:[],custom:[],feedback:[]};
const design={detail:'drawer',grouping:'topic'};
const scopeNames={atlas:'Mémoire d’Atlas',nova:'Mémoire de Nova',team:'Équipe Produit',orion:'Projet Orion',personal:'Mémoire personnelle'};
const screens=[['chat','01 · Conversation avec Atlas'],['capture','02 · Examiner un souvenir'],['agents','03 · Annuaire des agents'],['agent','04 · Mémoire d’Atlas'],['detail','05 · Détail et source'],['share','06 · Proposer à l’équipe'],['review','07 · Publier pour l’équipe'],['team','08 · Bibliothèque partagée'],['nova','09 · Ce que Nova peut consulter'],['merge','10 · Consolider les souvenirs'],['context','11 · Contexte d’une réponse'],['access','12 · Gérer les accès'],['personal','13 · Mémoire personnelle']];
picker.innerHTML=screens.map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
function active(){let a=base.filter(m=>!s.retired.includes(m.id)&&!(s.consolidated&&['read','edit'].includes(m.id)));if(s.proposal==='retained'&&!s.retired.includes('learned'))a.push(learned());if(s.shared==='published'&&!s.retired.includes('published'))a.push(published());if(s.consolidated&&!s.retired.includes('merged'))a.push(merged());return [...a,...s.custom.filter(m=>!s.retired.includes(m.id))];}
function learned(){return{id:'learned',scope:'atlas',title:'Retour du pilote : invitations',text:s.retainedText,topic:'Projet Orion',kind:'Retour d’expérience',date:'Aujourd’hui',source:'Préparer le lancement Orion · votre message',quote:sourceQuote,origin:'Proposé par Atlas · retenu par vous'};}
function published(){return{...learned(),id:'published',scope:'team',text:s.sharedText,source:'Extrait partagé · 21 septembre',quote:sourceQuote,origin:'Proposé par Atlas · publié par vous'};}
function merged(){return{id:'merged',scope:'team',title:'Ce que permet le rôle lecteur',text:s.mergedText,topic:'Accès aux documents',kind:'Connaissance',date:'Aujourd’hui',source:'Matrice des rôles · version 4',quote:'Lecteur : consultation autorisée. Modification non autorisée.',origin:'Synthèse retenue par vous'};}
function find(id){return active().find(m=>m.id===id)||base.find(m=>m.id===id)||(id==='learned'?learned():id==='published'?published():id==='merged'?merged():null);}
function readers(scope){return scope==='atlas'?'Vous et Atlas':scope==='nova'?'Vous et Nova':scope==='personal'?'Vous uniquement':scope==='orion'?'Vous, Camille et Atlas':`Les 3 membres${s.atlasAccess?' · Atlas':''}${s.novaAccess?' · Nova':''}`;}
function teamAccess(bot){return bot==='atlas'?s.atlasAccess:s.novaAccess;}
function allowed(bot){return active().filter(m=>m.scope===bot||(m.scope==='team'&&teamAccess(bot))||(m.scope==='orion'&&bot==='atlas'));}
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'Parcours mémoire complet',screen:s.route,panel:s.panel,agent:s.agent,detail:design.detail},privateContent:{state:s,design}}).catch(()=>{});}
function restore(snapshot){const p=snapshot?.privateContent;if(snapshot?.modelContent?.concept==='Parcours mémoire complet'&&p?.state){const t=p.state;s={...initial,...t};s.retired=Array.isArray(t.retired)?t.retired:[];s.custom=Array.isArray(t.custom)?t.custom.slice(0,8):[];s.trace=Array.isArray(t.trace)?t.trace:initial.trace;s.checked=[];s.query='';if(p.design){design.detail=p.design.detail==='page'?'page':'drawer';design.grouping=p.design.grouping==='kind'?'kind':'topic';}}}
function toast(text){s.message=text;}
function go(route,agent=s.agent){s.route=route;s.agent=agent;s.panel=null;s.returnPanel=null;s.query='';s.topic='all';s.checked=[];s.message='';s.tab=route==='agent'?'own':'active';render();persist();}
function open(panel,id=s.selected){s.returnPanel=s.panel==='context'&&panel==='detail'?'context':null;if(panel==='share'&&s.shared==='none')s.sharedText=find(id)?.text||s.retainedText;s.panel=panel;s.selected=id;s.message='';render();persist();}
function nav(label,ic,route,activeRoute,value=''){return `<button type="button" class="r-nav cursor-interaction" data-action="nav" data-value="${route}" data-agent="${value}" ${activeRoute?'aria-current="page"':''}>${icon(ic)}${label}</button>`;}
function sidebar(){return `<aside class="r-sidebar"><div class="r-brand">rakazo</div><div class="r-workspace"><span class="r-workspace-mark">P</span><span><strong>Produit</strong><div class="r-small">Espace d’équipe</div></span></div>${nav('Conversations','messages-square','chat',s.route==='chat')}${nav('Agents','bot','agents',['agents','profile','agent'].includes(s.route))}<div class="r-section-label">Mémoires partagées</div>${nav('Équipe Produit','library','team',s.route==='team')}${nav('Projet Orion','folder','project',s.route==='project')}<div class="r-section-label">Vos agents</div>${['atlas','nova'].map(a=>`<button type="button" class="r-nav cursor-interaction" data-action="open-agent" data-value="${a}">${avatar(a)}${nameOf(a)}</button>`).join('')}<div class="r-sidebar-bottom">${nav('Ma mémoire','bookmark','personal',s.route==='personal')}<div class="r-workspace">${avatar('human')}<span class="r-small">Vous · Administrateur</span></div></div></aside>`;}
function topbar(){let crumb=s.route==='chat'?`Atlas <span>/</span> Préparer le lancement Orion`:s.route==='agents'?'Agents':s.route==='profile'||s.route==='agent'?`Agents <span>/</span> ${nameOf(s.agent)} <span>/</span> ${s.route==='agent'?'Mémoire':'Aperçu'}`:s.route==='team'?'Équipe Produit <span>/</span> Mémoire':s.route==='project'?'Projet Orion <span>/</span> Mémoire':'Vous <span>/</span> Mémoire';return `<header class="r-topbar"><div class="r-crumbs"><span class="r-mobile-nav">${ib('menu','Navigation','panel','menu')}</span>${crumb}</div>${s.route==='chat'?btn(icon('brain')+'Mémoire','nav','agent','ghost'):''}</header>`;}
function tabs(list){return `<div class="r-tabs" role="tablist" aria-label="Vue">${list.map(([v,l])=>`<button type="button" role="tab" aria-selected="${s.tab===v}" class="r-tab cursor-interaction" data-action="tab" data-value="${v}">${l}</button>`).join('')}</div>`;}
function chat(){const saved=s.proposal==='retained'&&!s.retired.includes('learned');return `<div class="r-chat"><div class="r-chat-date">Aujourd’hui</div><div class="r-user-message">Prépare le compte rendu du lancement Orion. Au dernier pilote, le parcours d’invitation non testé a retardé l’ouverture.</div><div class="r-assistant">${avatar('atlas')}<div class="r-assistant-body"><div class="r-assistant-head"><strong>Atlas</strong><span class="r-small">Coordination</span></div><div class="r-answer"><p>Voici la trame du compte rendu.</p><ol><li><strong>Décision</strong> — Ouverture du pilote le 1er novembre.</li><li><strong>Point de vigilance</strong> — Vérifier le parcours d’invitation avant l’ouverture.</li><li><strong>Question ouverte</strong> — Qui prend en charge cette vérification ?</li></ol></div>${s.proposal==='pending'?`<div class="r-memory-moment">${icon('bookmark-plus')}<div><strong>Un retour d’expérience à retenir</strong><p class="r-small" style="margin-top:4px">${esc(proposalText)}</p><div class="r-actions">${btn('Examiner','panel','capture')}${btn('Écarter','discard','','ghost')}</div></div></div>`:saved?`<div class="r-memory-moment">${icon('bookmark-check')}<div><span>Retenu pour Atlas</span><div class="r-actions">${btn('Voir le souvenir','detail','learned','ghost')}${btn('Ouvrir sa mémoire','nav','agent','ghost')}</div></div></div>`:''}<div class="r-chat-meta"><button type="button" class="cursor-interaction" data-action="context" data-value="original">${icon('layers')}Contexte transmis · ${initial.trace.length}</button></div></div></div>${s.lastReply?`<div class="r-user-message">${esc(s.lastReply)}</div><div class="r-assistant">${avatar('atlas')}<div class="r-assistant-body">Voici le compte rendu actualisé. ${s.trace.some(m=>m.key==='launch'||m.id==='launch')?esc(s.trace.find(m=>m.key==='launch'||m.id==='launch').text):'La date d’ouverture reste à confirmer.'}<div class="r-chat-meta"><button type="button" class="cursor-interaction" data-action="context" data-value="latest">${icon('layers')}Voir le contexte transmis</button></div></div></div>`:''}<div class="r-composer"><textarea aria-label="Message à Atlas" placeholder="Continuer avec Atlas…"></textarea><div class="r-composer-footer"><span class="r-small">Conversation privée · Vous et Atlas</span>${btn(icon('arrow-up')+'Envoyer','send','','primary')}</div></div></div>`;}
function agents(){return `<div class="r-title-row"><div><h1>Vos agents</h1><p class="r-title-meta">Leur activité, leurs connaissances et leurs accès.</p></div></div><div class="r-cards">${['atlas','nova'].map(a=>`<button type="button" class="r-agent-card cursor-interaction" data-action="profile" data-value="${a}">${avatar(a,true)}<h2>${nameOf(a)}</h2><p>${a==='atlas'?'Coordination et suivi des projets':'Assistance et diagnostic'}</p><div class="r-section"><span class="r-small">Ouvrir l’agent</span></div></button>`).join('')}</div>`;}
function profile(){return `<div class="r-title-row"><div class="r-title-with-avatar">${avatar(s.agent,true)}<div><h1>${nameOf(s.agent)}</h1><p class="r-title-meta">${s.agent==='atlas'?'Coordination et suivi des projets':'Assistance et diagnostic'}</p></div></div>${btn(s.agent==='atlas'?'Discuter':'Voir sa mémoire','nav',s.agent==='atlas'?'chat':'agent')}</div><div class="r-tabs"><button type="button" class="r-tab" aria-selected="true">Aperçu</button><button type="button" class="r-tab cursor-interaction" data-action="nav" data-value="agent">Mémoire</button></div><div class="r-profile-section"><h3>Son rôle</h3><p>${s.agent==='atlas'?'Atlas prépare les points de suivi, retrouve les décisions et aide à organiser les prochaines étapes.':'Nova aide à comprendre les demandes et à retrouver les réponses dans les connaissances accessibles.'}</p></div><div class="r-profile-section"><h3>Ce qu’il peut consulter</h3><div class="r-card-row"><div><strong>Sa mémoire</strong><div class="r-small">${active().filter(m=>m.scope===s.agent).length} souvenir${active().filter(m=>m.scope===s.agent).length>1?'s':''} propre${active().filter(m=>m.scope===s.agent).length>1?'s':''}</div></div>${btn('Ouvrir','nav','agent')}</div>${teamAccess(s.agent)?`<div class="r-card-row"><div><strong>Équipe Produit</strong><div class="r-small">Mémoire partagée · lecture</div></div>${btn('Consulter','nav','team')}</div>`:''}</div>`;}
function scope(){return s.route==='agent'?s.agent:s.route==='team'?'team':s.route==='project'?'orion':'personal';}
function memoryRow(m){return `<button type="button" class="r-memory-row cursor-interaction" data-action="detail" data-value="${m.id}">${icon(m.kind==='Décision'?'flag':m.kind==='Retour d’expérience'?'book-open':'file-text')}<span class="r-row-body"><span class="r-row-title">${esc(m.title)}</span><span class="r-row-desc">${esc(m.text)}</span></span><span class="r-row-date">${m.date}</span></button>`;}
function listHtml(){let items=active().filter(m=>m.scope===scope());const q=s.query.toLocaleLowerCase('fr');if(q)items=items.filter(m=>`${m.title} ${m.text} ${m.topic}`.toLocaleLowerCase('fr').includes(q));if(s.topic!=='all')items=items.filter(m=>m.kind===s.topic);if(!items.length)return `<div class="r-empty">${icon('notebook')}<h3>${q||s.topic!=='all'?'Aucun résultat':'Aucun souvenir propre'}</h3><p class="r-small">${q?'Essayez un autre terme.':s.route==='agent'?'Les mémoires partagées restent disponibles selon ses accès.':'Ajoutez une première connaissance à cette mémoire.'}</p><div class="r-actions">${!q?btn('Ajouter un souvenir','panel','add'):''}${s.route==='agent'&&!q?btn('Voir les mémoires partagées','tab','shared','ghost'):''}</div></div>`;const groups=[...new Set(items.map(m=>m[design.grouping]))];return groups.map(g=>`<div class="r-group">${esc(g)}</div>${items.filter(m=>m[design.grouping]===g).map(memoryRow).join('')}`).join('');}
function sharedLibraries(){const src=[...(teamAccess(s.agent)?['team']:[]),...(s.agent==='atlas'?['orion']:[])];return `<p class="r-small" style="margin-bottom:20px">Ces connaissances restent dans leur mémoire d’origine.</p>${src.map(k=>`<div class="r-card-row"><div><strong>${scopeNames[k]}</strong><div class="r-small">${active().filter(m=>m.scope===k).length} souvenirs · lecture autorisée</div></div>${btn('Consulter','nav',k==='orion'?'project':'team')}</div>`).join('')||'<div class="r-empty"><h3>Aucune mémoire partagée accessible</h3></div>'}${s.agent==='nova'&&s.shared==='published'&&s.novaAccess&&!s.retired.includes('published')?`<div class="r-section"><h3>Récemment partagé avec Nova</h3>${memoryRow(published())}</div>`:''}<div class="r-section">${btn('Gérer les accès','panel','access','ghost')}</div>`;}
function reviews(){if(scope()==='atlas'&&s.proposal==='pending')return `<div class="r-review-row"><span class="r-small">Proposé par Atlas · conversation privée</span><h3 style="margin:7px 0">Retour du pilote : invitations</h3><p>${esc(proposalText)}</p><div class="r-actions">${btn('Examiner','panel','capture')}${btn('Écarter','discard','','ghost')}</div></div>`;if(scope()==='team'&&s.shared==='pending')return `<div class="r-review-row"><span class="r-small">Proposé par vous · issu de la mémoire d’Atlas</span><h3 style="margin:7px 0">Retour du pilote : invitations</h3><p>${esc(s.sharedText)}</p><div class="r-actions">${btn('Examiner la publication','panel','publish','primary')}</div></div>`;return `<div class="r-empty">${icon('check')}<h3>Aucune proposition à examiner</h3><p class="r-small">Les souvenirs retenus restent dans la bibliothèque.</p></div>`;}
function library(){const own=scope();const pending=(own==='atlas'&&s.proposal==='pending')||(own==='team'&&s.shared==='pending');let title=own==='atlas'||own==='nova'?nameOf(own):own==='team'?'Mémoire de l’équipe':own==='orion'?'Mémoire du projet Orion':'Ma mémoire';let heading=own==='atlas'||own==='nova'?`<div class="r-title-with-avatar">${avatar(own,true)}<div><h1>${title}</h1><p class="r-title-meta">Mémoire · ${readers(own)}</p></div></div>`:`<div><h1>${title}</h1><p class="r-title-meta">${readers(own)}</p></div>`;
const lists=s.route==='agent'?[['own','Propres'],['shared','Partagées'],...(pending?[['review','À examiner <span class="r-counter">1</span>']]:[])]:[['active','Souvenirs'],...(pending?[['review','À examiner <span class="r-counter">1</span>']]:[])];
return `<div class="r-title-row">${heading}<div class="r-actions">${own==='team'?btn('Accès','panel','access'):''}${btn(icon('plus')+'Ajouter','panel','add')}</div></div>${tabs(lists)}${s.tab==='shared'&&s.route==='agent'?sharedLibraries():s.tab==='review'?reviews():`<div class="r-toolbar"><label class="r-search">${icon('search')}<input type="search" aria-label="Rechercher dans cette mémoire" placeholder="Rechercher un souvenir" value="${esc(s.query)}"></label><div class="r-actions"><select class="r-select" aria-label="Type de souvenir"><option value="all">Tous les types</option>${['Connaissance','Décision','Retour d’expérience','Convention','Préférence'].map(k=>`<option ${s.topic===k?'selected':''}>${k}</option>`).join('')}</select>${own==='team'&&!s.consolidated?btn('Consolider','panel','select-merge'):''}</div></div><div class="r-memory-list">${listHtml()}</div>`}`;}
function panelFrame(title,body,footer='',sub='',wide=false){return `<section class="r-panel ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="r-panel-head"><div><h2>${title}</h2>${sub?`<p class="r-title-meta">${sub}</p>`:''}</div>${ib('x','Fermer','close')}</header><div class="r-panel-body">${body}</div>${footer?`<footer class="r-panel-footer">${footer}</footer>`:''}</section>`;}
function sourceBox(m){return `<div class="r-source"><div class="r-source-title">${icon('quote')}${esc(m.source)}</div><blockquote>« ${esc(m.quote)} »</blockquote></div>`;}
function detail(){const m=find(s.selected);if(!m)return panelFrame('Souvenir indisponible','');const retired=s.retired.includes(m.id)||(s.consolidated&&['read','edit'].includes(m.id));return panelFrame('Souvenir',`<span class="r-inline-tag">${esc(m.kind)}</span><div class="r-detail-title">${esc(m.title)}</div><p class="r-detail-text">${esc(m.text)}</p><dl class="r-meta"><dt>Mémoire</dt><dd>${scopeNames[m.scope]}</dd><dt>Responsable</dt><dd>${m.scope==='team'||m.scope==='orion'?'Vous et Camille':'Vous'}</dd><dt>Peuvent lire</dt><dd>${readers(m.scope)}</dd><dt>Origine</dt><dd>${esc(m.origin)}</dd><dt>État</dt><dd>${s.consolidated&&['read','edit'].includes(m.id)?'Remplacé par la synthèse':retired?'Retiré du rappel':'Retenu'}</dd></dl>${sourceBox(m)}${btn(m.id==='published'?'Voir l’extrait partagé':'Ouvrir la source','source',m.id,'ghost')}<div class="r-section"><h3>Historique</h3><div style="margin-top:15px"><div class="r-history-row"><strong>${m.date}</strong><div class="r-small">${esc(m.origin)}</div></div>${retired?'<div class="r-history-row"><strong>Aujourd’hui</strong><div class="r-small">Retiré par vous · conservé dans l’historique</div></div>':''}</div></div>${m.id==='merged'?`<div class="r-section"><h3>Souvenirs d’origine</h3>${['read','edit'].map(id=>`<div class="r-card-row"><span class="r-small">${find(id).title}</span>${btn('Voir','source',id,'ghost')}</div>`).join('')}</div>`:''}`,retired?btn('Fermer','close'):btn('Retirer','panel','retire','ghost')+(m.scope==='atlas'&&m.id==='learned'?btn('Proposer à l’équipe','panel','share','primary'):btn('Modifier','panel','edit','primary')));}
function capture(){return panelFrame('Retenir pour Atlas',`<label class="r-field"><span>Souvenir proposé</span><textarea class="r-textarea" data-field="capture" aria-label="Souvenir proposé">${esc(s.retainedText)}</textarea></label><dl class="r-meta"><dt>Peuvent lire</dt><dd>Vous et Atlas</dd><dt>Sujet</dt><dd>Projet Orion</dd></dl>${sourceBox(learned())}<p class="r-note">La proposition n’est pas utilisée comme mémoire tant qu’elle n’est pas retenue.</p>`,btn('Écarter','discard','','ghost')+btn('Retenir pour Atlas','retain','','primary'),'Depuis votre conversation');}
function sharing(publish=false){return panelFrame(publish?'Publier pour l’équipe':'Proposer à l’équipe',`<label class="r-field"><span>${publish?'Version proposée':'Texte à partager'}</span>${publish?`<p class="r-detail-text">${esc(s.sharedText)}</p>`:`<textarea class="r-textarea" data-field="share" aria-label="Texte à partager">${esc(s.sharedText)}</textarea>`}</label><div class="r-card-row"><div><strong>Équipe Produit</strong><div class="r-small">${readers('team')}</div></div>${icon('users')}</div><dl class="r-meta"><dt>Examinent</dt><dd>Vous et Camille</dd><dt>Après publication</dt><dd>Les membres et agents autorisés de l’équipe</dd></dl><div class="r-source"><div class="r-source-title">${icon('quote')}Extrait partagé</div><blockquote>« ${esc(sourceQuote)} »</blockquote></div><p class="r-note">Seuls ce texte et cet extrait seront partagés. La conversation privée reste privée.</p>`,publish?btn('Écarter','decline-share','','ghost')+btn('Publier pour l’équipe','publish','','primary'):btn('Annuler','back-detail','','ghost')+btn('Transmettre la proposition','submit-share','','primary'),publish?'Une proposition à examiner':'Depuis la mémoire d’Atlas');}
function contextPanel(){const trace=s.contextVersion==='latest'?s.trace:initial.trace;return panelFrame('Contexte transmis',`<p class="r-small" style="margin-bottom:19px">${s.contextVersion==='latest'?'Nouvelle réponse rejouée':'Réponse initiale du 21 septembre'} · Vous et Atlas</p>${trace.map(m=>`<div class="r-sent-item"><span class="r-small">${scopeNames[m.scope]}</span><h3 style="margin:5px 0">${esc(m.title)}</h3><p>${esc(m.text)}</p><p class="r-reason">${esc(m.reason)}</p>${s.retired.includes(m.id)?'<span class="r-inline-tag">Retiré depuis cette réponse</span>':btn('Ouvrir le souvenir','detail',m.id,'ghost')}${btn(s.feedback.includes(s.contextVersion+':'+m.id)?'Signalé hors sujet':'Hors sujet pour cette tâche','irrelevant',m.id,'ghost',s.feedback.includes(s.contextVersion+':'+m.id))}</div>`).join('')||'<p>Aucun souvenir transmis.</p>'}<div class="r-section"><p class="r-small">Cette vue conserve ce qui a été envoyé pour cette réponse. Les corrections s’appliquent aux réponses suivantes.</p></div>`,btn('Rejouer avec la mémoire actuelle','replay','','primary'));}
function accessPanel(){return panelFrame('Accès à la mémoire',`<p class="r-small" style="margin-bottom:20px">Équipe Produit</p><h3>Membres</h3>${['Vous|Administrateur','Camille|Peut publier','Alex|Peut lire'].map(v=>{const[n,r]=v.split('|');return `<div class="r-check-row"><span class="r-avatar human">${n[0]}</span><span>${n}</span><span class="r-small">${r}</span></div>`;}).join('')}<div class="r-section"><h3>Agents autorisés à consulter</h3><label class="r-check-row"><input type="checkbox" data-access="atlas" ${s.atlasAccess?'checked':''}><span>Atlas</span><span class="r-small">Lecture</span></label><label class="r-check-row"><input type="checkbox" data-access="nova" ${s.novaAccess?'checked':''}><span>Nova</span><span class="r-small">Lecture</span></label><p class="r-note">Ces accès ne permettent pas aux agents de publier dans la mémoire de l’équipe.</p></div>`,btn('Annuler','close','','ghost')+btn('Enregistrer les accès','save-access','','primary'));}
function mergePanel(select=false){if(select){const records=active().filter(m=>m.scope==='team');return panelFrame('Consolider des souvenirs',`<p class="r-small" style="margin-bottom:18px">Sélectionnez les deux connaissances sur le rôle lecteur.</p>${records.map(m=>`<label class="r-selection-row"><input type="checkbox" data-merge="${m.id}" ${s.checked.includes(m.id)?'checked':''}><span><strong>${esc(m.title)}</strong><span class="r-row-desc">${esc(m.text)}</span></span></label>`).join('')}<div class="r-selection-bar"><span data-selected-count>${s.checked.length} sélectionné${s.checked.length>1?'s':''}</span><span class="r-small">Équipe Produit</span></div>`,btn('Annuler','close','','ghost')+btn('Préparer une synthèse','prepare-merge','','primary',!(s.checked.includes('read')&&s.checked.includes('edit')&&s.checked.length===2)));}
return panelFrame('Examiner la consolidation',`<div class="r-small">Deux souvenirs · une même source</div>${['read','edit'].map(id=>`<div class="r-before">${find(id).text}</div>`).join('')}<label class="r-field" style="margin-top:22px"><span>Synthèse proposée</span><textarea class="r-textarea" data-field="merge" aria-label="Synthèse proposée">${esc(merged().text)}</textarea></label><dl class="r-meta"><dt>Mémoire</dt><dd>Équipe Produit</dd><dt>Peuvent lire</dt><dd>${readers('team')}</dd></dl><p class="r-note">Après validation, cette synthèse remplacera les deux souvenirs dans le rappel. Leurs sources et leurs versions resteront consultables.</p>`,btn('Annuler','close','','ghost')+btn('Retenir cette synthèse','merge','','primary'),'Sources et périmètre conservés',true);}
function editor(edit=false){const m=edit?find(s.selected):null;return panelFrame(edit?'Modifier le souvenir':'Ajouter un souvenir',`<label class="r-field"><span>Titre</span><input class="r-input" data-field="title" aria-label="Titre du souvenir" value="${esc(m?.title||'')}"></label><label class="r-field"><span>Contenu</span><textarea class="r-textarea" data-field="text" aria-label="Contenu du souvenir">${esc(m?.text||'')}</textarea></label><dl class="r-meta"><dt>Mémoire</dt><dd>${scopeNames[m?.scope||scope()]}</dd><dt>Peuvent lire</dt><dd>${readers(m?.scope||scope())}</dd></dl><p class="r-note">Une saisie de votre part sera enregistrée comme déclaration explicite.</p>`,btn('Annuler','close','','ghost')+btn('Enregistrer','save-edit',edit?'edit':'add','primary'));}
function panel(){if(s.panel==='capture')return capture();if(s.panel==='detail')return detail();if(s.panel==='share')return sharing();if(s.panel==='publish')return sharing(true);if(s.panel==='context')return contextPanel();if(s.panel==='access')return accessPanel();if(s.panel==='select-merge')return mergePanel(true);if(s.panel==='merge')return mergePanel();if(s.panel==='add'||s.panel==='edit')return editor(s.panel==='edit');if(s.panel==='source'){const m=find(s.selected);return panelFrame(m.id==='published'?'Extrait partagé':'Source du souvenir',`<div class="r-small">${esc(m.source)}</div>${sourceBox(m)}<dl class="r-meta"><dt>Version</dt><dd>${m.id==='learned'?'Message original':'Version conservée lors de l’enregistrement'}</dd><dt>Accès</dt><dd>${m.id==='published'?'Extrait approuvé uniquement':readers(m.scope)}</dd></dl>`,btn('Retour au souvenir','back-detail'));}if(s.panel==='retire'){const m=find(s.selected);return panelFrame('Retirer ce souvenir ?',`<p>${esc(m.title)}</p><p class="r-note">Il ne sera plus transmis depuis ${m.scope==='team'?'la mémoire de l’équipe':m.scope==='orion'?'la mémoire du projet':'cette mémoire'}. Sa source et les anciennes réponses restent conservées.</p>`,btn('Annuler','back-detail','','ghost')+btn('Retirer du rappel','retire','','primary'));}if(s.panel==='menu')return panelFrame('Navigation',`${nav('Conversation avec Atlas','messages-square','chat',false)}${nav('Agents','bot','agents',false)}${nav('Mémoire de l’équipe','library','team',false)}${nav('Projet Orion','folder','project',false)}${nav('Ma mémoire','bookmark','personal',false)}`);return '';}
function currentScreen(){return s.panel==='capture'?'capture':s.panel==='share'?'share':s.panel==='publish'?'review':['merge','select-merge'].includes(s.panel)?'merge':s.panel==='context'?'context':s.panel==='access'?'access':s.panel==='detail'?'detail':s.route==='agent'&&s.agent==='nova'?'nova':s.route==='profile'?'agents':s.route;}
function render(){root.dataset.detail=design.detail;const content=s.route==='chat'?chat():s.route==='agents'?agents():s.route==='profile'?profile():library();stage.innerHTML=`<div class="r-app" ${s.panel?'inert':''}>${sidebar()}<div class="r-main">${topbar()}<main class="r-content">${content}</main></div></div>${s.panel?`<div class="r-overlay ${['share','retire'].includes(s.panel)?'center':''}">${panel()}</div>`:''}`;picker.value=currentScreen();notice.textContent=s.message;const input=stage.querySelector('input[type=search]');if(input)input.addEventListener('input',e=>{s.query=e.target.value;stage.querySelector('.r-memory-list').innerHTML=listHtml();icons();});const filter=stage.querySelector('[aria-label="Type de souvenir"]');if(filter)filter.onchange=e=>{s.topic=e.target.value;stage.querySelector('.r-memory-list').innerHTML=listHtml();icons();};stage.querySelectorAll('[data-merge]').forEach(c=>c.onchange=()=>{s.checked=[...stage.querySelectorAll('[data-merge]:checked')].map(x=>x.dataset.merge);stage.querySelector('[data-selected-count]').textContent=`${s.checked.length} sélectionné${s.checked.length>1?'s':''}`;stage.querySelector('[data-action="prepare-merge"]').disabled=!(s.checked.length===2&&s.checked.includes('read')&&s.checked.includes('edit'));});icons();}
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18,'stroke-width':1.5}});}
function rebuildTrace(){const a=allowed('atlas'),key=m=>m.key||m.id;s.trace=a.filter(m=>['launch','format','learned','published'].includes(key(m))).filter((m,i,arr)=>key(m)!=='published'||!arr.some(x=>key(x)==='learned')).map(m=>({id:m.id,key:key(m),scope:m.scope,title:m.title,text:m.text,reason:key(m)==='launch'?'Date applicable au projet Orion.':key(m)==='format'?'Convention de compte rendu de l’équipe.':'Retour d’expérience applicable au lancement.'}));s.traceUpdated=true;}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,v=el.dataset.value;
if(a==='context'){s.contextVersion=v;open('context');return;}if(a==='nav'){go(v,v==='chat'?'atlas':s.agent);return;}if(a==='open-agent'){go('agent',v);return;}if(a==='profile'){go('profile',v);return;}if(a==='tab'){s.tab=v;s.query='';s.topic='all';s.message='';}
else if(a==='panel'){open(v);return;}else if(a==='detail'){open('detail',v);return;}else if(a==='close'){s.panel=s.returnPanel||null;s.returnPanel=null;s.message='';}else if(a==='back-detail'){if(s.sourceParent){s.selected=s.sourceParent;s.sourceParent=null;}s.panel='detail';}
else if(a==='source'){s.sourceParent=s.selected;s.selected=v;s.panel='source';}
else if(a==='discard'){s.proposal='dismissed';s.panel=null;toast('Proposition écartée. Elle ne sera pas rappelée comme souvenir.');}
else if(a==='retain'){const value=stage.querySelector('[data-field=capture]').value.trim();if(!value){toast('Saisissez le souvenir à retenir.');notice.textContent=s.message;return;}s.retainedText=value;s.proposal='retained';s.retired=s.retired.filter(id=>id!=='learned');s.panel=null;toast('Souvenir retenu pour Atlas. Vous pouvez le retrouver dans sa mémoire.');}
else if(a==='submit-share'){const value=stage.querySelector('[data-field=share]').value.trim();if(!value){toast('Saisissez le texte à partager.');notice.textContent=s.message;return;}s.sharedText=value;s.shared='pending';s.panel=null;s.route='team';s.tab='review';toast('Proposition transmise aux responsables de la mémoire d’équipe.');}
else if(a==='publish'){s.shared='published';s.panel=null;s.route='team';s.tab='active';toast('Publié pour l’équipe. Les agents autorisés peuvent maintenant le consulter.');}
else if(a==='decline-share'){s.shared='none';s.panel=null;s.tab='active';toast('Publication écartée. Le souvenir privé d’Atlas est conservé.');}
else if(a==='save-access'){s.novaAccess=stage.querySelector('[data-access=nova]').checked;s.atlasAccess=stage.querySelector('[data-access=atlas]').checked;s.panel=null;toast('Accès enregistrés pour les prochaines consultations.');}
else if(a==='prepare-merge'){s.panel='merge';}
else if(a==='merge'){const value=stage.querySelector('[data-field=merge]').value.trim();if(!value){toast('Saisissez une synthèse avant de la retenir.');notice.textContent=s.message;return;}s.mergedText=value;s.consolidated=true;s.panel=null;s.route='team';s.tab='active';toast('Synthèse retenue. Les deux souvenirs d’origine restent consultables depuis son détail.');}
else if(a==='retire'){s.retired.push(s.selected);s.panel=null;toast('Souvenir retiré du rappel futur. Les anciennes réponses conservent leur contexte transmis.');}
else if(a==='irrelevant'){const feedbackId=`${s.contextVersion}:${v}`;if(!s.feedback.includes(feedbackId))s.feedback.push(feedbackId);toast('Signal enregistré pour cette tâche. Le souvenir reste dans sa mémoire.');}
else if(a==='replay'){rebuildTrace();s.contextVersion='latest';s.lastReply='Refais le compte rendu avec la mémoire actuelle.';toast('Une nouvelle réponse a été simulée. L’ancienne réponse et son contexte sont conservés.');}
else if(a==='send'){const t=stage.querySelector('.r-composer textarea').value.trim();if(!t){toast('Écrivez un message pour simuler une nouvelle réponse.');notice.textContent=s.message;return;}s.lastReply=t;rebuildTrace();s.contextVersion='latest';toast('Nouvelle réponse simulée. Son contexte est consultable.');}
else if(a==='save-edit'){const title=stage.querySelector('[data-field=title]').value.trim(),text=stage.querySelector('[data-field=text]').value.trim();if(!title||!text){toast('Complétez le titre et le contenu.');notice.textContent=s.message;return;}const old=v==='edit'?find(s.selected):null;if(old){s.retired.push(old.id);}const m={id:`custom-${s.custom.length+1}`,scope:old?.scope||scope(),key:old?.key||old?.id||null,title,text,topic:old?.topic||'Ajouts manuels',kind:old?.kind||'Connaissance',date:'Aujourd’hui',source:'Votre saisie explicite',quote:text,origin:old?'Version modifiée par vous':'Ajouté par vous'};s.custom.push(m);s.selected=m.id;s.panel='detail';toast('Souvenir enregistré dans le périmètre affiché.');}
render();persist();});
picker.onchange=e=>{const v=e.target.value;s.panel=null;s.message='';s.query='';s.topic='all';s.checked=[];if(v==='chat'){s.route='chat';s.agent='atlas';}else if(v==='agents'){s.route='agents';}else if(v==='capture'){s.route='chat';s.panel='capture';}else if(v==='agent'){s.route='agent';s.agent='atlas';s.tab='own';}else if(v==='detail'||v==='share'){s.proposal='retained';s.route='agent';s.agent='atlas';s.tab='own';s.selected='learned';s.panel=v;}else if(v==='review'){s.proposal='retained';s.shared='pending';s.route='team';s.tab='review';s.panel='publish';}else if(v==='team'){s.route='team';s.tab='active';}else if(v==='nova'){s.route='agent';s.agent='nova';s.tab='shared';}else if(v==='merge'){s.route='team';s.tab='active';s.panel='merge';}else if(v==='context'){s.route='chat';s.contextVersion='original';s.panel='context';}else if(v==='access'){s.route='team';s.tab='active';s.panel='access';}else if(v==='personal'){s.route='personal';s.tab='active';}render();persist();};
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();persist();}});t.addSelect(design,'detail',{label:'Détail d’un souvenir',options:[{label:'Panneau latéral',value:'drawer'},{label:'Vue pleine largeur',value:'page'}]});t.addSelect(design,'grouping',{label:'Organisation des listes',options:[{label:'Par sujet',value:'topic'},{label:'Par nature',value:'kind'}]});}
})();
</script>
</div>
