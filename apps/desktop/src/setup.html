<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>Set up Dax</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">Dax</span>
      <button id="quit" class="titlebar-quit" type="button" title="Quit Dax">Quit</button>
    </header>

    <main class="shell">
      <h1 class="heading">Welcome to Dax</h1>

      <form id="setup" novalidate>
        <label class="field-label" for="server-url">Server address</label>
        <input
          id="server-url"
          class="field"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="https://rakazo.example.com"
        />

        <label class="field-label" for="access-id">Cloudflare Access client ID</label>
        <input
          id="access-id"
          class="field"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Optional"
        />
        <label class="field-label" for="access-secret">Cloudflare Access client secret</label>
        <input
          id="access-secret"
          class="field"
          type="password"
          spellcheck="false"
          autocomplete="off"
          placeholder="Optional"
        />
        <p class="hint">
          Only for servers behind Cloudflare Access. Leave the secret empty to keep the one
          already saved.
        </p>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="check" class="button button-secondary" type="button">Check connection</button>
          <button id="continue" class="button button-primary" type="submit">Continue</button>
        </div>
      </form>
    </main>

    <script src="setup.js"></script>
  </body>
</html>
