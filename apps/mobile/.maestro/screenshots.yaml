appId: com.rakazo.app
name: Rakazo mobile screenshots
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Rakazo|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- assertVisible: "Sign in to Rakazo"
- takeScreenshot: "01-sign-in"

- tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- tapOn: "Cancel"

- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- takeScreenshot: "04-inbox"

- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 10000
- takeScreenshot: "05-activity"

- tapOn: "Search"
- inputText: "fixture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "06-search-results"

- openLink: "rakazo:///new"
- assertVisible: "Name this bot"
- takeScreenshot: "07-new-bot"

- openLink: "rakazo:///new-group"
- assertVisible: "Name this group"
- takeScreenshot: "08-new-group"

- openLink: "rakazo:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "09-new-space"

- openLink: "rakazo:///account"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 10000
- takeScreenshot: "10-account"
- tapOn: "Change password"
- assertVisible: "Current password"
- takeScreenshot: "10b-change-password"
- back

- openLink: "rakazo:///models"
- extendedWaitUntil:
    visible: "Active model"
    timeout: 10000
- scrollUntilVisible:
    element: "Show more"
    direction: DOWN
- takeScreenshot: "11-models"
- tapOn: "Show more"
- scrollUntilVisible:
    element: "Show less"
    direction: DOWN
- takeScreenshot: "11b-all-providers"

- openLink: "rakazo:///voice"
- extendedWaitUntil:
    visible: "Scripted"
    timeout: 10000
- takeScreenshot: "12-voice"

- openLink: "rakazo:///integrations"
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
- takeScreenshot: "13-integrations"
- tapOn:
    id: "integrations-advanced"
- assertVisible: "Add MCP server"
- takeScreenshot: "14-integrations-advanced"

- openLink: "rakazo:///skills"
- extendedWaitUntil:
    visible: "New skill"
    timeout: 10000
- takeScreenshot: "14b-skills"
- tapOn:
    id: "skills-tab-marketplaces"
- assertVisible: "Add marketplace"
- takeScreenshot: "14c-skills-marketplaces"

- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "Select text"
- takeScreenshot: "15-thread"
- longPressOn: "The fixture workspace is ready."
- assertVisible: "Reply"
- assertVisible: "Speak message"
- assertVisible: "Copy"
- assertVisible: "Select text"
- takeScreenshot: "15b-message-actions"
- tapOn: "Select text"
- assertNotVisible: "Reply"
- takeScreenshot: "15d-message-select-text"
- back
# User messages have no Speak.
- longPressOn: "Summarize the fixture launch checklist."
- assertVisible: "Reply"
- assertVisible: "Copy"
- assertNotVisible: "Speak message"
- tapOn: "Reply"
- assertVisible: "Replying to"
- tapOn: "Cancel reply"
# Bot actions live on a long press of the header title (its accessible name
# is the bot's name; a short press opens the bot's page).
- longPressOn: "Researcher"
- assertVisible: "Clear conversation"
- takeScreenshot: "16-bot-actions"
- back

- openLink: "rakazo:///bot?botId=${RAKAZO_SCREENSHOT_BOT_ID}&tab=settings"
- extendedWaitUntil:
    visible: "Instructions"
    timeout: 10000
- assertVisible: "Voice and replies"
- assertVisible: "Model"
- assertVisible: "Space default.*"
- takeScreenshot: "17-bot-settings"

- openLink: "rakazo:///computer?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 10000
- takeScreenshot: "18-computer"

- openLink: "rakazo:///group-thread?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- takeScreenshot: "19-group-thread"
- longPressOn: "The fixture launch plan is ready."
- assertVisible: "Reply"
- assertVisible: "Select text"
- back

- openLink: "rakazo:///group-settings?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}"
- extendedWaitUntil:
    visible: "Delete group"
    timeout: 10000
- takeScreenshot: "20-group-settings"

- openLink: "rakazo:///bot-routine?botId=${RAKAZO_SCREENSHOT_BOT_ID}&routineId=${RAKAZO_SCREENSHOT_ROUTINE_ID}"
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "21-routine"

# Verify saved appearance changes on already-mounted screens and modal routes.
- openLink: "rakazo:///account"
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- takeScreenshot: "22-account-dark"

- openLink: "rakazo:///new"
- assertVisible: "Name this bot"
- takeScreenshot: "23-new-bot-dark"

- openLink: "rakazo:///new-group"
- assertVisible: "Name this group"
- takeScreenshot: "24-new-group-dark"

- openLink: "rakazo:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "25-new-space-dark"

- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- takeScreenshot: "26-thread-dark"

- openLink: "rakazo:///group-thread?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- takeScreenshot: "27-group-thread-dark"

- openLink: "rakazo:///group-settings?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}"
- assertVisible: "Delete group"
- takeScreenshot: "28-group-settings-dark"

- openLink: "rakazo:///account"
- tapOn: "Light"
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- assertVisible: "The fixture workspace is ready."
- takeScreenshot: "29-thread-light-restored"

# Capture the reaction after theme comparisons. Reactions are append-only, so adding
# 👍 earlier would leak into dark/light thread frames with no remove control.
- longPressOn: "The fixture workspace is ready."
- tapOn: "👍"
- extendedWaitUntil:
    visible: "👍"
    timeout: 10000
- assertNotVisible: "Reply"
- takeScreenshot: "15c-message-reaction"
