      <path d="M-6 64 Q14 70 30 76"/><path d="M-2 60 Q16 66 34 73"/>
    </g>
  </g>
</g>
<ellipse cx="-58" cy="-28.76" rx="10.5" ry="11" fill="#2b2b2e" filter="url(#soft)" transform="translate(1.2 1.6)"/>
<ellipse cx="-58" cy="-28.76" rx="9.6" ry="10.2" fill="url(#hole)"/>
<path d="M-49.2 -26 A9.2 9.8 0 0 1 -60 -18.8" fill="none" stroke="#4a4a4f" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round" filter="url(#soft)"/>
